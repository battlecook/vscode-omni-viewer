<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{cspNonce}}' {{cspSource}}; style-src 'unsafe-inline' {{cspSource}}; img-src data:; font-src data:; frame-src 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Viewer - {{fileName}}</title>
    <style nonce="{{cspNonce}}">
        html, body { height: 100%; margin: 0; padding: 0; }
        body {
            display: flex;
            flex-direction: column;
            background: var(--vscode-editor-background, #1e1e1e);
            color: var(--vscode-foreground, #d4d4d4);
            font-family: var(--vscode-font-family, sans-serif);
        }
        .omni-html-shell-bar {
            display: flex;
            justify-content: flex-end;
            padding: 6px 10px;
            flex-shrink: 0;
        }
        #html-root {
            flex: 1 1 auto;
            min-height: 0;
            --omni-fg: var(--vscode-foreground, #d4d4d4);
            --omni-bg: var(--vscode-editor-background, #1e1e1e);
            --omni-border: var(--vscode-widget-border, var(--vscode-panel-border, #454545));
            --omni-accent: var(--vscode-button-background, #0e639c);
            --omni-accent-fg: var(--vscode-button-foreground, #fff);
            --omni-warning-fg: var(--vscode-editorWarning-foreground, #cca700);
            --omni-font: var(--vscode-font-family, system-ui, sans-serif);
            --omni-font-size: var(--vscode-font-size, 13px);
            --omni-font-mono: var(--vscode-editor-font-family, monospace);
        }
    </style>
</head>
<body>
    <div class="omni-html-shell-bar">{{omniShareButtons}}</div>
    <div id="html-root"></div>
    <script nonce="{{cspNonce}}" id="html-data" type="application/json">{{htmlData}}</script>
    <script nonce="{{cspNonce}}" src="js/htmlViewer.js" data-omni-no-inline></script>
</body>
</html>
