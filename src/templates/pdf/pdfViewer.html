<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer - {{fileName}}</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            display: flex;
            flex-direction: column;
            background: var(--vscode-editor-background, #1e1e1e);
            color: var(--vscode-foreground, #d4d4d4);
            font-family: var(--vscode-font-family, sans-serif);
        }
        .omni-pdf-shell-bar {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            padding: 6px 10px;
            flex-shrink: 0;
        }
        #pdf-root {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
        }
    </style>
    <script>
        window.__OMNI_PDFJS_WORKER__ = '{{pdfJsWorkerUri}}';
    </script>
    <script>
        window.__OMNI_PDFJS_READY__ = import('{{pdfJsScriptUri}}').then((module) => {
            const pdfjsLib = module && module.default ? module.default : module;
            if (window.__OMNI_PDFJS_WORKER__ && pdfjsLib && pdfjsLib.GlobalWorkerOptions) {
                pdfjsLib.GlobalWorkerOptions.workerSrc = window.__OMNI_PDFJS_WORKER__;
            }
            return pdfjsLib;
        });
    </script>
</head>
<body>
    <div class="omni-pdf-shell-bar">
        {{omniShareButtons}}
    </div>
    <div id="pdf-root"></div>

    <script id="pdf-data" type="application/json">{"base64":"{{pdfBase64}}","fileName":"{{fileName}}","locale":"{{locale}}"}</script>
    <script src="js/pdfViewer.js"></script>
</body>
</html>
